# Réplica local de la arquitectura de la nube. Escalar a mano para la prueba de carga:
#   docker compose up -d --build --scale api=3 --scale worker=3
# En Cloud Run las réplicas las decide el autoescalado; acá las fija --scale.
x-backend: &backend
  build: .
  environment:
    GOOGLE_CLOUD_PROJECT: tarjetazo-local
    PUBSUB_EMULATOR_HOST: pubsub:8085
    FIRESTORE_EMULATOR_HOST: firestore:8080
    DEMORA_DEPENDENCIA_S: ${DEMORA:-0}
  depends_on: [pubsub, firestore]

services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=tarjetazo-local

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=tarjetazo-local
    ports: ["8081:8080"]

  api: *backend

  worker: *backend

  # Hace de balanceador de carga de Cloud Run: reparte entre las réplicas de cada servicio.
  balanceador:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["${PUERTO:-8000}:80"]
    depends_on: [api, worker]

  iniciar:
    <<: *backend
    command: python iniciar_emulador.py
    restart: on-failure
